[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "local-pdf-agent"
version = "0.1.0"
description = "A small PDF preprocessing and local-model agent framework"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["pypdf>=6.21.4"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
local-pdf-agent = "local_pdf_agent.cli:main"

[tool.setuptools.packages.find]
include = ["local_pdf_agent*"]
